# Réglages de confidentialité du Recruiter Copilot local.

[browser]
# Streamlit envoie des statistiques d'usage par défaut : on les coupe.
gatherUsageStats = false
serverAddress = "127.0.0.1"

[server]
# N'écouter que sur cette machine : personne d'autre sur le Wi-Fi ne peut ouvrir l'app.
address = "127.0.0.1"
port = 8501
# Pas d'ouverture automatique du navigateur ni de demande d'e-mail au premier lancement.
headless = true
# Taille maximale d'un fichier importé, en Mo.
maxUploadSize = 10
# Relance l'app à chaque sauvegarde du code (pratique pendant le build).
runOnSave = true
